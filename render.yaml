databases:
  - name: mafiagame-db
    databaseName: mafiagame
    user: mafia
    plan: free

services:
  - type: web
    name: worker
    env: docker
    plan: free
    dockerContext: ./worker
    dockerfilePath: ./worker/Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: "6000"

  - type: web
    name: backend
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: mafiagame-db
          property: connectionString
      - key: RUNNER_URL
        value: http://worker:6000

  - type: web
    name: frontend
    env: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: "80"

