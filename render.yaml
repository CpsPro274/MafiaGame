databases:
  - name: mafiagame-db
    databaseName: mafiagame
    user: mafia
    plan: free

services:
  - type: web
    name: worker
    env: docker
    plan: free
    dockerContext: ./worker
    dockerfilePath: ./worker/Dockerfile
    autoDeploy: true

  - type: web
    name: backend
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mafiagame-db
          property: connectionString
      - key: WORKER_HOSTPORT
        fromService:
          type: web
          name: worker
          property: hostport

  - type: web
    name: frontend
    env: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    autoDeploy: true
    envVars:
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: backend
          property: hostport
