version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: mafia
      POSTGRES_PASSWORD: mafia_pass
      POSTGRES_DB: mafiagame
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafia -d mafiagame"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  worker:
    build: ./worker
    restart: unless-stopped
    ports:
      - "6000:6000"
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://mafia:mafia_pass@postgres:5432/mafiagame
      - RUNNER_URL=http://worker:6000
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge